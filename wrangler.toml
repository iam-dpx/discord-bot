# wrangler.toml
# Dead Pixel — Discord customizer bot (Cloudflare Worker)
# Written by Dead Pixel (iamreal.dpx@gmail.com)

name = "dead-pixel-discord-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Secrets are set via the Cloudflare dashboard (Settings → Variables and
# Secrets → encrypted), same as before — never written here:
#   DISCORD_TOKEN
#   DISCORD_PUBLIC_KEY
#   DISCORD_APPLICATION_ID

# --- Server list feature ---
# Fill in database_id after creating the D1 database in the dashboard
# (Storage & databases → D1 → Create database). Everything else here is
# plain (non-secret) config, so it's fine committed to the repo.
[[d1_databases]]
binding = "DB"
database_name = "discord-bot-db"
database_id = "afd61810-aa2e-411d-ac6a-9b07984773e1"

[ai]			
binding = "AI"

[vars]
APPROVAL_CHANNEL_ID = "1471831034801950926"
PUBLIC_CHANNEL_ID = "1468891625467023464"
MOD_ROLE_ID = "1468539537352294543"
ALLOWED_GUILD_ID = "1468539537352294539"
